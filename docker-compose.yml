# ============================================================
# AGROPLATAFORMA DIGITAL - MAIZ NATIVO HUASTECA POTOSINA
# PEE-2025-G-369 | TecNM Ciudad Valles
# Docker Compose v3.0 - 6 esquemas + catalogos
# ============================================================

services:

  db:
    image: postgis/postgis:15-3.3
    container_name: agroplataforma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       agroplataforma
      POSTGRES_USER:     agro_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-huasteca2025}
    volumes:
      - pgdata:/var/lib/postgresql/data

      - ../agro-db/db/00_maestro.sql:/docker-entrypoint-initdb.d/00_maestro.sql:ro
      - ../agro-db/db/01_sistema.sql:/docker-entrypoint-initdb.d/01_sistema.sql:ro
      - ../agro-db/db/02_catalogo.sql:/docker-entrypoint-initdb.d/02_catalogo.sql:ro
      - ../agro-db/db/03_trazabilidad.sql:/docker-entrypoint-initdb.d/03_trazabilidad.sql:ro
      - ../agro-db/db/04_core.sql:/docker-entrypoint-initdb.d/04_core.sql:ro
      - ../agro-db/db/05_geografico.sql:/docker-entrypoint-initdb.d/05_geografico.sql:ro
      - ../agro-db/db/06_social.sql:/docker-entrypoint-initdb.d/06_social.sql:ro
      - ../agro-db/db/07_cultural.sql:/docker-entrypoint-initdb.d/07_cultural.sql:ro
      - ../agro-db/db/08_agronomico.sql:/docker-entrypoint-initdb.d/08_agronomico.sql:ro
      - ../agro-db/db/09_fenotipico.sql:/docker-entrypoint-initdb.d/09_fenotipico.sql:ro
      - ../agro-db/db/09_indices.sql:/docker-entrypoint-initdb.d/09_indices.sql:ro
      - ../agro-db/db/10_ambiental.sql:/docker-entrypoint-initdb.d/10_ambiental.sql:ro
      - ../agro-db/db/10_triggers.sql:/docker-entrypoint-initdb.d/10_triggers.sql:ro
      - ../agro-db/db/11_vistas.sql:/docker-entrypoint-initdb.d/11_vistas.sql:ro
      - ../agro-db/db/12_datos_base.sql:/docker-entrypoint-initdb.d/12_datos_base.sql:ro
      - ../agro-db/db/13_localidades_colonias.sql:/docker-entrypoint-initdb.d/13_localidades_colonias.sql:ro

      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_admin -d agroplataforma"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agro_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agroplataforma_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:                   ${PGADMIN_EMAIL:-admin@tecnm.mx}
      PGADMIN_DEFAULT_PASSWORD:                ${PGADMIN_PASSWORD:-admin2025}
      PGADMIN_CONFIG_SERVER_MODE:              "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agro_network

  backup:
    image: alpine:3.19
    container_name: agroplataforma_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:-huasteca2025}
      PGHOST: db
      PGUSER: agro_admin
      PGDATABASE: agroplataforma
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache postgresql-client > /dev/null 2>&1;
        while true; do
          sleep 86400;
          FECHA=$$(date +%Y%m%d_%H%M);
          pg_dump > /backups/backup_$$FECHA.dump;
          ls -t /backups/backup_*.dump | tail -n +8 | xargs rm -f;
        done
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agro_network

volumes:
  pgdata:
    name: agroplataforma_pgdata
  pgadmin_data:
    name: agroplataforma_pgadmin

networks:
  agro_network:
    name: agro_network
    driver: bridge